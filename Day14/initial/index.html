<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Pokémon Trainer Lab</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1>⚡ Pokémon Trainer Lab</h1>

    <p>
        Train your first Pokémon!
    </p>


    <div class="pokemon-card">

        <h2 id="pokemon-name">
            Pikachu
        </h2>

        <p id="pokemon-number">
            #025
        </p>


        <img
            id="pokemon-image"
            src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            alt="Pikachu"
        >


        <p>
            Type:
            <span id="pokemon-type">
                Electric ⚡
            </span>
        </p>


        <hr>


        <p>
            ❤️ HP:
            <span id="hp">35</span>
        </p>


        <p>
            ⚔️ Attack:
            <span id="attack">55</span>
        </p>


        <p>
            🛡️ Defense:
            <span id="defense">40</span>
        </p>


        <button id="power-btn">
            ⚡ Power Up
        </button>


        <p id="message">
            Pikachu is ready!
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
